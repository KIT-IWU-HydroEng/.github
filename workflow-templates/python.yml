name: Python

on:
  push:
    branches: [ $default-branch ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      # Rules can be configured in pyproject.toml or ruff.toml: https://docs.astral.sh/ruff/configuration/
      - name: Lint
        run: ruff check --output-format=github .

      # Remove this step if the code is not formatted with ruff
      - name: Check formatting
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Add windows-latest and/or macos-latest if the code is used on those systems
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e .; fi
          pip install pytest pytest-cov

      # pytest fails if no tests are found; add tests (e.g. in a tests/ folder) before enabling this workflow
      - name: Run tests
        run: pytest --cov --cov-report=term-missing
