name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please check the existing issues first to avoid duplicates.
        **Do not report security vulnerabilities here.** See our [security policy](https://github.com/KIT-IWU-HydroEng/.github/blob/main/.github/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem? Include a minimal example and input data if possible.
      placeholder: |
        1. Run '...' with input '...'
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any relevant error messages or log output. This will be formatted as code automatically.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag or commit hash you are using.
      placeholder: e.g. v1.2.0 or 4d0cffe
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and relevant software versions (e.g. Python, MATLAB, compilers, packages).
      placeholder: |
        - OS: Windows 11
        - Python: 3.12
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, figures or anything else that helps explain the problem.
