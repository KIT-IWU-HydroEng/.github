name: Documentation
description: Report missing, unclear or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Which file, section or page is affected?
      placeholder: e.g. README.md, section "Installation"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is the problem?
      description: Describe what is missing, unclear or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: How could the documentation be improved?
